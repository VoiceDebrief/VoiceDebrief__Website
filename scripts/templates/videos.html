<script>
/* Facade: swap the card's poster for the player only when asked. youtube-nocookie
   avoids the tracking cookie until playback, and nothing at all is fetched before
   the click. */
document.querySelectorAll('.vid__play').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var id = btn.dataset.yt;
    if (!id) return;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0';
    f.title = btn.getAttribute('aria-label') || 'Video';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    btn.replaceWith(f);
  });
});
</script>
