<div class="wa-key">
  <label for="key">Your OpenRouter key</label>
  <div class="wa-key__row">
    <input id="key" type="password" autocomplete="off" spellcheck="false"
           placeholder="sk-or-…  (get one at openrouter.ai/keys)">
    <button type="button">Save key</button>
  </div>
  <p class="wa-key__status">Bring your own key for the beta. It is stored only in this
     browser and sent only to OpenRouter with each request.</p>
</div>
