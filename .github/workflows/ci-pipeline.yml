name: CI Pipeline

# Order of operations on push to dev/main:
#   1. test           — unit (node --test) + integration (Playwright boots the
#                       real app against the live engine origin). A failure here
#                       stops the release: no tag, no publish.
#   2. increment-tag  — bumps the repo `version` file and pushes the tag
#                       (dev = minor, main = major). CI owns the version file.
#   3. publish-pages  — runs AFTER tagging, pulls the freshly bumped commit,
#                       stamps the version into the site footer and version.txt,
#                       and deploys website/ to GitHub Pages.
#   4. qa-live        — after the deploy, checks the LIVE site end to end
#                       (pages, version stamp, cache-busted assets, samples,
#                       prompts, engine origin reachability + CORS).
#
# The bump commit is pushed with GITHUB_TOKEN, which does not re-trigger this
# workflow, so there is no tag->publish loop; publishing happens in this same
# run against the pulled bump commit.

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: "ci-pipeline-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        shell: bash
        run: node --test tests/unit/*.test.mjs 2>&1 | tee unit.log

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Integration test (app boot against the live engine origin)
        shell: bash
        run: node tests/integration/app-boot.test.mjs 2>&1 | tee int-boot.log

      - name: Integration test (chat loop against a scripted OpenRouter)
        shell: bash
        run: node tests/integration/chat-loop.test.mjs 2>&1 | tee int-chat.log

      # The engineering hub (issue 036) renders the gate this deploy passed —
      # collect the per-layer counts for scripts/emit_engineering_json.py.
      - name: Collect test results for the engineering hub
        shell: bash
        run: |
          UNIT_PASS=$(grep -oP '^# pass \K\d+' unit.log)
          UNIT_FAIL=$(grep -oP '^# fail \K\d+' unit.log)
          BOOT=$(grep -c '^ok ' int-boot.log)
          CHAT=$(grep -c '^ok ' int-chat.log)
          printf '{\n  "unit": {"pass": %s, "total": %s},\n  "integration-boot": {"pass": %s, "total": %s},\n  "integration-chat": {"pass": %s, "total": %s}\n}\n' \
            "$UNIT_PASS" "$((UNIT_PASS + UNIT_FAIL))" "$BOOT" "$BOOT" "$CHAT" "$CHAT" > test-results.json
          cat test-results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v4

      - name: Increment Tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ github.ref_name == 'main' && 'major' || 'minor' }}

  build-pages:
    name: Build Site (versioned)
    runs-on: ubuntu-latest
    needs: [test, increment-tag]
    # Publish from dev (the Pages estate). Runs even when increment-tag is
    # skipped (manual dispatch) so the site can be re-published on demand —
    # but never when tests failed.
    if: always() && needs.test.result == 'success' && (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped') && (github.ref_name == 'dev')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull the version bump commit
        run: git pull origin ${{ github.ref_name }}

      - name: Stamp version into the site
        run: |
          VER=$(cat version)
          echo "Publishing site at version: $VER"
          cp version website/version.txt
          # The version chip appears on every page's footer (issue 033).
          find website -name '*.html' -exec \
            sed -i "s|<span id=\"site-version\">[^<]*</span>|<span id=\"site-version\">$VER</span>|" {} +
          grep -rho 'site-version">[^<]*' website --include='*.html' | sort | uniq -c

      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results

      - name: Emit engineering JSON (issue 036)
        # status.json / issues.json / docs.json — the /engineering/ pages'
        # entire data layer, written at deploy time like version.txt.
        run: |
          python3 scripts/emit_engineering_json.py --site website \
            --version "$(cat version)" --target "github-pages (dev)" \
            --results test-results.json

      - name: Cache-bust the site's own assets
        # GitHub Pages serves our modules with max-age=600, so without this a
        # browser can run the previous deploy's JavaScript against the new HTML
        # for ten minutes (issue 026). Upstream tools-origin URLs are left alone.
        run: python3 scripts/stamp_cache_busters.py --site website --version "$(cat version)"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-pages]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  qa-live:
    name: QA (live site)
    runs-on: ubuntu-latest
    needs: [deploy-pages]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull the version bump commit
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the live site serves this release
        run: EXPECT_VERSION="$(cat version)" node tests/qa/live-site-check.mjs
