name: QA Deploy (Netlify)

# The QA estate (issue 030). GitHub Pages is taken by dev (one site per repo),
# so the `qa` branch publishes to Netlify instead:
#
#   push to qa  →  test (same gate as the release pipeline)
#               →  deploy-netlify (version stamped as <version>-qa.<sha>,
#                                  cache-busted, published with netlify-cli,
#                                  then tests/qa/live-site-check.mjs against the
#                                  deployed URL — in the same job, see below)
#
# No tagging happens here — `version` stays owned by the dev/main pipeline; QA
# deploys are identified by the -qa.<short-sha> suffix stamped into the site.
#
# Requires two repository secrets (Settings → Secrets → Actions):
#   NETLIFY_AUTH_TOKEN  a Netlify personal access token
#   NETLIFY_SITE_ID     the site's API ID (create the site once in the Netlify UI)
# Until they exist the deploy step is skipped with a warning instead of failing,
# so the test gate still reports on every qa push.

on:
  push:
    branches:
      - qa
    # Belt-and-braces against a re-trigger loop from the commit-baselines job
    # below. The primary guard is that GITHUB_TOKEN pushes do not start
    # workflows; this second guard survives someone swapping in a PAT.
    paths-ignore:
      - 'website/user-guide/screenshots/**'
  workflow_dispatch:

concurrency:
  group: "qa-deploy"
  cancel-in-progress: false

jobs:
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate published content
        run: python3 scripts/build_content.py --check

      - name: Validate the user-guide manifest
        run: python3 scripts/build_user_guide.py --check

      - name: Unit tests
        shell: bash
        run: node --test tests/unit/*.test.mjs 2>&1 | tee unit.log

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1 pixelmatch pngjs
          npx playwright install --with-deps chromium

      - name: Integration test (app boot against the live engine origin)
        shell: bash
        run: node tests/integration/app-boot.test.mjs 2>&1 | tee int-boot.log

      - name: Integration test (chat loop against a scripted OpenRouter)
        shell: bash
        run: node tests/integration/chat-loop.test.mjs 2>&1 | tee int-chat.log

      # QA-to-docs (issue 038): same journeys and diff gate as the release
      # pipeline — a QA push that changes the UI is caught (or its baseline
      # refreshed) before the change reaches dev.
      - name: QA-to-docs journeys (screenshot QA + docs capture)
        shell: bash
        run: node tests/qa-to-docs/run.mjs 2>&1 | tee qa-docs.log

      - name: Upload QA-to-docs captures (candidate baselines / diff reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-to-docs
          path: tests/qa-to-docs/output/
          if-no-files-found: ignore

      # Same collection as the release pipeline — the QA estate's /engineering/
      # pages render the gate this QA build passed (issue 036).
      - name: Collect test results for the engineering hub
        shell: bash
        run: |
          UNIT_PASS=$(grep -oP '^# pass \K\d+' unit.log)
          UNIT_FAIL=$(grep -oP '^# fail \K\d+' unit.log)
          BOOT=$(grep -c '^ok ' int-boot.log)
          CHAT=$(grep -c '^ok ' int-chat.log)
          QTD=$(grep -c '^ok ' qa-docs.log)
          printf '{\n  "unit": {"pass": %s, "total": %s},\n  "integration-boot": {"pass": %s, "total": %s},\n  "integration-chat": {"pass": %s, "total": %s},\n  "qa-to-docs": {"pass": %s, "total": %s}\n}\n' \
            "$UNIT_PASS" "$((UNIT_PASS + UNIT_FAIL))" "$BOOT" "$BOOT" "$CHAT" "$CHAT" "$QTD" "$QTD" > test-results.json
          cat test-results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

  # The docs half of QA-to-docs (issue 038). The test job captures screenshots
  # into an artifact and the container dies with them; this job is the only way
  # a capture ever becomes a committed baseline — and therefore a picture in the
  # user guide.
  #
  # It commits ONLY shots that have no baseline yet. A shot whose baseline exists
  # and differs is the gate firing: the test job is already red, this job does not
  # run, and nothing overwrites the evidence. Auto-blessing a diff would turn the
  # gate into a recorder that faithfully files every regression as the new truth.
  # Refreshing an intended change stays deliberate (UPDATE_BASELINES=1, M-qtd-3).
  #
  # The push uses GITHUB_TOKEN, whose pushes do not trigger workflows — the same
  # property the version bump on dev/main already relies on, so no loop.
  commit-baselines:
    name: Commit new screenshot baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: github.event_name == 'push' && github.ref_name == 'qa'
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Download the QA-to-docs captures
        uses: actions/download-artifact@v4
        with:
          name: qa-to-docs
          path: qa-to-docs-artifact

      - name: Commit candidates that have no baseline yet
        id: commit
        run: |
          mkdir -p website/user-guide/screenshots
          added=0
          for f in qa-to-docs-artifact/candidates/*.png; do
            [ -e "$f" ] || continue                       # no candidates: nothing to arm
            dest="website/user-guide/screenshots/$(basename "$f")"
            if [ -e "$dest" ]; then
              echo "skip $(basename "$f") — baseline exists (a change here must go through UPDATE_BASELINES)"
              continue
            fi
            cp "$f" "$dest"
            added=$((added + 1))
          done
          if [ "$added" -eq 0 ]; then
            echo "no new baselines — the guide's pictures are already current"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/user-guide/screenshots
          printf '%s\n\n%s\n' \
            "QA-to-docs: arm $added screenshot baseline(s) from CI run ${GITHUB_RUN_NUMBER}" \
            "Captured by the qa-to-docs journeys in this run and committed by CI — baselines are never produced on a laptop (font rendering differs). From here they are both the diff gate's reference and the user guide's illustrations." \
            > /tmp/baseline-commit-msg
          git commit -F /tmp/baseline-commit-msg
          git push origin qa
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "### Armed $added screenshot baseline(s)" >> "$GITHUB_STEP_SUMMARY"

  deploy-netlify:
    name: Deploy to Netlify (QA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, commit-baselines]
    # commit-baselines is skipped on workflow_dispatch; deploy still must run.
    if: always() && needs.test.result == 'success' && needs.commit-baselines.result != 'failure'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull any baselines committed by this run
        # Same pattern as build-pages pulling the version bump on dev: the
        # checkout above predates commit-baselines' push, so without this the
        # new screenshots would not ship until the next deploy. Guarded on the
        # branch so a workflow_dispatch elsewhere never merges qa into it.
        if: github.ref_name == 'qa'
        run: git pull --ff-only origin qa

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the site's content (updates, videos, versions)
        # content/*.md -> the rendered pages + manifests. Runs FIRST so the
        # generated pages get the version stamp and the cache-buster like
        # every other page. --ref qa: the QA estate's derived links point at
        # the qa branch — files can exist here before they exist on dev.
        run: python3 scripts/build_content.py --ref qa

      - name: Build the user guide from the QA captures (issue 038)
        # Renders website/user-guide/ from tests/qa-to-docs/journeys.json plus
        # whatever baselines are committed — including any armed moments ago.
        run: python3 scripts/build_user_guide.py

      - name: Stamp QA version into the site
        id: stamp
        # A QA build previews the NEXT release, so it is stamped with the next
        # version number (latest tag + 1) plus the -qa.<short-sha> suffix. The
        # `version` file is never touched — CI on dev/main owns it — and branch
        # copies of it lag dev, so the truth comes from the tags.
        run: |
          LATEST=$(git ls-remote --tags origin 'v*' | awk -F/ '{print $NF}' | grep -v '\^{}' | sort -V | tail -1)
          NEXT="v$(echo "${LATEST#v}" | awk -F. '{print $1"."$2"."$3+1}')"
          VER="$NEXT-qa.$(git rev-parse --short HEAD)"
          echo "QA build version: $VER (latest release tag: $LATEST)"
          echo "$VER" > website/version.txt
          find website -name '*.html' -exec \
            sed -i "s|<span id=\"site-version\">[^<]*</span>|<span id=\"site-version\">$VER</span>|" {} +
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results

      - name: Emit engineering JSON (issue 036)
        run: |
          python3 scripts/emit_engineering_json.py --site website \
            --version "${{ steps.stamp.outputs.version }}" --target "netlify (qa)" \
            --results test-results.json

      - name: Cache-bust the site's own assets
        run: python3 scripts/stamp_cache_busters.py --site website --version "${{ steps.stamp.outputs.version }}"

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets not set — QA deploy skipped. Add them in Settings → Secrets → Actions (see .github/workflows/qa-deploy.yml header)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir website \
            --message "qa ${GITHUB_SHA::7}" --json > netlify-deploy.json
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "### QA deployed ($(jq -r '.site_name // "site"' netlify-deploy.json))" >> "$GITHUB_STEP_SUMMARY"

      # Same job as the deploy on purpose: when NETLIFY_SITE_ID is the site name,
      # the deploy URL contains a secret value and GitHub refuses to pass it
      # between jobs ("Skip output 'url' since it may contain secret") — a
      # separate qa-live job would receive an empty URL (runs #2–#3). Reading
      # the URL from the deploy's own JSON file sidesteps outputs entirely.
      - name: Check the QA site serves this build
        if: steps.deploy.outputs.deployed == 'true'
        env:
          EXPECT_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          LIVE_URL=$(jq -r '.url // .deploy_url' netlify-deploy.json) \
            node tests/qa/live-site-check.mjs
